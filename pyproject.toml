[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mmcif-tools"
dynamic = ["version"]
description = "Small, pipeable command-line tools to select, edit and inspect mmCIF files (standard library only)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Matteo Cagiada" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["mmCIF", "PDBx", "PDB", "protein structure", "structural biology", "command line"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]

[project.urls]
Homepage = "https://github.com/matteo-cagiada/mmcif-tools"
Documentation = "https://matteo-cagiada.github.io/mmcif-tools/"
Changelog = "https://github.com/matteo-cagiada/mmcif-tools/blob/main/CHANGELOG.md"
Issues = "https://github.com/matteo-cagiada/mmcif-tools/issues"

[project.scripts]
mmcif_assembly = "mmciftools.mmcif_assembly:main"
mmcif_auth2label = "mmciftools.mmcif_auth2label:main"
mmcif_b = "mmciftools.mmcif_b:main"
mmcif_blocks = "mmciftools.mmcif_blocks:main"
mmcif_cat = "mmciftools.mmcif_cat:main"
mmcif_chain = "mmciftools.mmcif_chain:main"
mmcif_chkensemble = "mmciftools.mmcif_chkensemble:main"
mmcif_delcat = "mmciftools.mmcif_delcat:main"
mmcif_delchain = "mmciftools.mmcif_delchain:main"
mmcif_delelem = "mmciftools.mmcif_delelem:main"
mmcif_delentity = "mmciftools.mmcif_delentity:main"
mmcif_delhetatm = "mmciftools.mmcif_delhetatm:main"
mmcif_delinsertion = "mmciftools.mmcif_delinsertion:main"
mmcif_delmeta = "mmciftools.mmcif_delmeta:main"
mmcif_delres = "mmciftools.mmcif_delres:main"
mmcif_delresname = "mmciftools.mmcif_delresname:main"
mmcif_element = "mmciftools.mmcif_element:main"
mmcif_fetch = "mmciftools.mmcif_fetch:main"
mmcif_fixinsert = "mmciftools.mmcif_fixinsert:main"
mmcif_frompdb = "mmciftools.mmcif_frompdb:main"
mmcif_gap = "mmciftools.mmcif_gap:main"
mmcif_head = "mmciftools.mmcif_head:main"
mmcif_info = "mmciftools.mmcif_info:main"
mmcif_intersect = "mmciftools.mmcif_intersect:main"
mmcif_keepcat = "mmciftools.mmcif_keepcat:main"
mmcif_keepcoord = "mmciftools.mmcif_keepcoord:main"
mmcif_label2auth = "mmciftools.mmcif_label2auth:main"
mmcif_merge = "mmciftools.mmcif_merge:main"
mmcif_mkensemble = "mmciftools.mmcif_mkensemble:main"
mmcif_occ = "mmciftools.mmcif_occ:main"
mmcif_reatom = "mmciftools.mmcif_reatom:main"
mmcif_reres = "mmciftools.mmcif_reres:main"
mmcif_rplchain = "mmciftools.mmcif_rplchain:main"
mmcif_rplresname = "mmciftools.mmcif_rplresname:main"
mmcif_selaltloc = "mmciftools.mmcif_selaltloc:main"
mmcif_selatom = "mmciftools.mmcif_selatom:main"
mmcif_selchain = "mmciftools.mmcif_selchain:main"
mmcif_selelem = "mmciftools.mmcif_selelem:main"
mmcif_selentity = "mmciftools.mmcif_selentity:main"
mmcif_selhetatm = "mmciftools.mmcif_selhetatm:main"
mmcif_selmodel = "mmciftools.mmcif_selmodel:main"
mmcif_selres = "mmciftools.mmcif_selres:main"
mmcif_selresname = "mmciftools.mmcif_selresname:main"
mmcif_shiftres = "mmciftools.mmcif_shiftres:main"
mmcif_sort = "mmciftools.mmcif_sort:main"
mmcif_splitchain = "mmciftools.mmcif_splitchain:main"
mmcif_splitmodel = "mmciftools.mmcif_splitmodel:main"
mmcif_tidy = "mmciftools.mmcif_tidy:main"
