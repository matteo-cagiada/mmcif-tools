[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cif-tools"
version = "0.0.1"
description = "A swiss army knife for manipulating and editing mmCIF files, in the spirit of pdb-tools."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]

[project.optional-dependencies]
test = ["gemmi"]

# Console scripts (cif_selchain, cif_delhetatm, ...) are added from phase 1 on, e.g.:
# [project.scripts]
# cif_selchain = "ciftools.cif_selchain:main"

[tool.setuptools]
packages = ["ciftools"]
