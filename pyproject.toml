[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cif-tools"
version = "0.0.1"
description = "A swiss army knife for manipulating and editing mmCIF files, in the spirit of pdb-tools."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]

[project.optional-dependencies]
test = ["gemmi", "pdb-tools"]

[project.scripts]
cif_auth2label = "ciftools.cif_auth2label:main"
cif_b = "ciftools.cif_b:main"
cif_blocks = "ciftools.cif_blocks:main"
cif_cat = "ciftools.cif_cat:main"
cif_chain = "ciftools.cif_chain:main"
cif_chkensemble = "ciftools.cif_chkensemble:main"
cif_delcat = "ciftools.cif_delcat:main"
cif_delchain = "ciftools.cif_delchain:main"
cif_delelem = "ciftools.cif_delelem:main"
cif_delhetatm = "ciftools.cif_delhetatm:main"
cif_delinsertion = "ciftools.cif_delinsertion:main"
cif_delres = "ciftools.cif_delres:main"
cif_delresname = "ciftools.cif_delresname:main"
cif_element = "ciftools.cif_element:main"
cif_fetch = "ciftools.cif_fetch:main"
cif_fixinsert = "ciftools.cif_fixinsert:main"
cif_frompdb = "ciftools.cif_frompdb:main"
cif_gap = "ciftools.cif_gap:main"
cif_head = "ciftools.cif_head:main"
cif_intersect = "ciftools.cif_intersect:main"
cif_keepcat = "ciftools.cif_keepcat:main"
cif_keepcoord = "ciftools.cif_keepcoord:main"
cif_label2auth = "ciftools.cif_label2auth:main"
cif_merge = "ciftools.cif_merge:main"
cif_mkensemble = "ciftools.cif_mkensemble:main"
cif_occ = "ciftools.cif_occ:main"
cif_reatom = "ciftools.cif_reatom:main"
cif_reres = "ciftools.cif_reres:main"
cif_rplchain = "ciftools.cif_rplchain:main"
cif_rplresname = "ciftools.cif_rplresname:main"
cif_selaltloc = "ciftools.cif_selaltloc:main"
cif_selatom = "ciftools.cif_selatom:main"
cif_selchain = "ciftools.cif_selchain:main"
cif_selelem = "ciftools.cif_selelem:main"
cif_selhetatm = "ciftools.cif_selhetatm:main"
cif_selmodel = "ciftools.cif_selmodel:main"
cif_selres = "ciftools.cif_selres:main"
cif_selresname = "ciftools.cif_selresname:main"
cif_shiftres = "ciftools.cif_shiftres:main"
cif_sort = "ciftools.cif_sort:main"
cif_splitchain = "ciftools.cif_splitchain:main"
cif_splitmodel = "ciftools.cif_splitmodel:main"
cif_tidy = "ciftools.cif_tidy:main"
cif_tofasta = "ciftools.cif_tofasta:main"
cif_topdb = "ciftools.cif_topdb:main"
cif_uniqname = "ciftools.cif_uniqname:main"
cif_validate = "ciftools.cif_validate:main"
cif_wc = "ciftools.cif_wc:main"

[tool.setuptools]
packages = ["ciftools"]
