name: release

# Builds the sdist and the wheel, checks them, and uploads them with PyPI's Trusted Publishing (no API token):
# - Actions > release > Run workflow: uploads to TestPyPI, to try a release first;
# - publishing a GitHub release whose tag is v<version> (mmciftools.__version__): uploads to PyPI.
# PyPI and TestPyPI each list this repository, this workflow (release.yml) and an environment (pypi, testpypi)
# as a trusted publisher. A version can be uploaded only once to each, even after deleting it.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: The release tag is v<version>
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "$TAG" = "v$(python -c 'import mmciftools; print(mmciftools.__version__)')"
      - name: Build the sdist and the wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: The wheel installs, and every command runs
        run: |
          python -m pip install dist/*.whl
          python tools/smoke_test.py
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/mmcif-tools
    permissions:
      id-token: write  # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mmcif-tools
    permissions:
      id-token: write  # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.3
