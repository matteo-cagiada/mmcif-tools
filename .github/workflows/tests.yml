name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The library itself must work with no dependencies at all.
      - name: Tests (stdlib only)
        run: python -m unittest discover -s tests -v
      - name: Install test extras
        run: python -m pip install -e ".[test]"
      - name: Tests (with gemmi cross-checks)
        run: python -m unittest discover -s tests -v
