name: checks

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          # Python 3.9 (end of life, but macOS's own python3) has no build
          # for ubuntu-latest (26.04) any more; 24.04 still has 3.9.25.
          - os: ubuntu-24.04
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.15"
          - os: windows-latest
            python-version: "3.15"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install
        run: python -m pip install .
      - name: Every command runs, and a few pipelines give the expected results
        run: python tools/smoke_test.py
      - name: The tool reference is up to date
        run: python tools/make_docs.py --check
